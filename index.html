<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WNBA Roster Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 20px 0 24px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; }
    header p  { color: #888; font-size: 0.85rem; margin-top: 4px; }

    section { margin-bottom: 28px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #888;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .player-card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player-card.ir-card { border-color: #3a2a10; background: #1e1810; }

    .player-info { flex: 1; min-width: 0; }
    .player-name { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-meta { font-size: 0.75rem; color: #666; margin-top: 2px; }

    .btn {
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-ir     { background: #2a1f00; color: #f5a623; }
    .btn-active { background: #0f2a1a; color: #4ade80; }
    .btn-remove { background: #2a1018; color: #f87171; margin-left: 4px; }

    .add-form {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 14px;
      padding: 18px;
    }

    .form-group { margin-bottom: 14px; position: relative; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }

    input[type="text"] {
      width: 100%;
      background: #0f0f13;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 1rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: #5b5bdb; }

    /* Search results dropdown */
    #search-results {
      display: none;
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #1e1e2e;
      border: 1px solid #3a3a50;
      border-radius: 10px;
      margin-top: 4px;
      z-index: 100;
      overflow: hidden;
    }
    .search-result {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #2a2a38;
      transition: background 0.1s;
    }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover, .search-result:active { background: #2a2a40; }
    .result-name { font-weight: 600; font-size: 0.95rem; }
    .result-team { font-size: 0.8rem; color: #888; margin-top: 2px; }

    /* Confirm card */
    #confirm-card {
      display: none;
      background: #12201a;
      border: 1px solid #4ade80;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    #confirm-card .confirm-name { font-weight: 700; font-size: 1.05rem; }
    #confirm-card .confirm-team { font-size: 0.85rem; color: #888; margin-top: 3px; }
    #confirm-card .confirm-actions { display: flex; gap: 10px; margin-top: 14px; }
    #confirm-card .btn-confirm  { flex: 1; background: #4ade80; color: #0a1a10; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; padding: 11px; cursor: pointer; }
    #confirm-card .btn-cancel   { background: #2a2a38; color: #aaa; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; padding: 11px 16px; cursor: pointer; }

    .ir-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .ir-toggle input { width: 18px; height: 18px; cursor: pointer; accent-color: #f5a623; }
    .ir-toggle span  { font-size: 0.9rem; color: #ccc; }

    .searching-hint { font-size: 0.75rem; color: #555; margin-top: 6px; }

    .empty { color: #555; font-size: 0.9rem; padding: 10px 2px; }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #23232f;
      border: 1px solid #3a3a50;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: transform 0.25s ease;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: #4ade80; color: #4ade80; }
    #toast.error   { border-color: #f87171; color: #f87171; }
  </style>
</head>
<body>

<header>
  <h1>🏀 WNBA Roster</h1>
  <p>Tap IR to bench • tap Active to restore • tap ✕ to drop</p>
</header>

<section>
  <div class="section-title">Active</div>
  <div id="active-list"><div class="empty">Loading...</div></div>
</section>

<section>
  <div class="section-title">IR</div>
  <div id="ir-list"><div class="empty">Loading...</div></div>
</section>

<section>
  <div class="section-title">Add Player</div>
  <div class="add-form">

    <!-- Confirm card (hidden until player selected) -->
    <div id="confirm-card">
      <div class="confirm-name" id="confirm-name"></div>
      <div class="confirm-team" id="confirm-team"></div>
      <div class="confirm-actions">
        <button class="btn-confirm" onclick="confirmAdd()">Add to Roster</button>
        <button class="btn-cancel" onclick="cancelSearch()">Cancel</button>
      </div>
      <div style="margin-top:12px;">
        <label class="ir-toggle">
          <input type="checkbox" id="inp-ir">
          <span>Add directly to IR</span>
        </label>
      </div>
    </div>

    <!-- Search input -->
    <div class="form-group" id="search-group">
      <label>Player Name</label>
      <input type="text" id="inp-search" placeholder="Type a name to search…" autocomplete="off" oninput="onSearch()">
      <div id="search-results"></div>
      <div class="searching-hint" id="search-hint"></div>
    </div>

  </div>
</section>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bxnebhaxunffngsimomr.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4bmViaGF4dW5mZm5nc2ltb21yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MzQwMjIsImV4cCI6MjA5NDExMDAyMn0.gukJ4FnS_MpeVmXVoYpioExNuI9qY_BRGb6FWqctE2c";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let _selectedPlayer = null; // { name, espn_id, team }
  let _searchTimer    = null;

  // ── Roster render ─────────────────────────────────────

  async function loadRoster() {
    const { data, error } = await sb
      .from("roster_config")
      .select("*")
      .order("name");

    if (error) { showToast("Failed to load roster", "error"); return; }

    renderList("active-list", data.filter(p => !p.is_ir), false);
    renderList("ir-list",     data.filter(p =>  p.is_ir), true);
  }

  function renderList(containerId, players, isIr) {
    const el = document.getElementById(containerId);
    if (!players.length) {
      el.innerHTML = `<div class="empty">${isIr ? "No players on IR" : "No active players"}</div>`;
      return;
    }
    el.innerHTML = players.map(p => `
      <div class="player-card ${isIr ? "ir-card" : ""}">
        <div class="player-info">
          <div class="player-name">${esc(p.name)}</div>
          <div class="player-meta">${esc(p.team || "")}</div>
        </div>
        <button class="btn ${isIr ? "btn-active" : "btn-ir"}"
                onclick="toggleIR('${p.id}', ${isIr})">
          ${isIr ? "Active" : "IR"}
        </button>
        <button class="btn btn-remove" onclick="removePlayer('${p.id}', '${esc(p.name)}')">✕</button>
      </div>
    `).join("");
  }

  // ── Actions ───────────────────────────────────────────

  async function toggleIR(id, currentlyIr) {
    const { error } = await sb
      .from("roster_config")
      .update({ is_ir: !currentlyIr })
      .eq("id", id);
    if (error) { showToast("Update failed", "error"); return; }
    showToast(currentlyIr ? "Moved to Active" : "Moved to IR", "success");
    loadRoster();
  }

  async function removePlayer(id, name) {
    if (!confirm(`Drop ${name} from roster?`)) return;
    const { error } = await sb.from("roster_config").delete().eq("id", id);
    if (error) { showToast("Remove failed", "error"); return; }
    showToast(`${name} dropped`, "success");
    loadRoster();
  }

  // ── Player search ─────────────────────────────────────

  function onSearch() {
    const q = document.getElementById("inp-search").value.trim();
    clearTimeout(_searchTimer);
    const resultsEl = document.getElementById("search-results");
    const hintEl    = document.getElementById("search-hint");

    if (q.length < 2) {
      resultsEl.style.display = "none";
      hintEl.textContent = "";
      return;
    }

    hintEl.textContent = "Searching…";
    _searchTimer = setTimeout(() => searchESPN(q), 350);
  }

  async function searchESPN(query) {
    const resultsEl = document.getElementById("search-results");
    const hintEl    = document.getElementById("search-hint");

    try {
      const url = `https://site.api.espn.com/apis/search/v2?query=${encodeURIComponent(query)}&sport=basketball&league=wnba&limit=10`;
      const resp = await fetch(url);
      const data = await resp.json();

      // Pull the player results block and filter to WNBA only
      const playerBlock = (data.results || []).find(r => r.type === "player");
      const athletes = (playerBlock?.contents || []).filter(a => a.description === "WNBA");

      hintEl.textContent = "";

      if (!athletes.length) {
        resultsEl.innerHTML = `<div class="search-result"><div class="result-name" style="color:#666">No WNBA players found</div></div>`;
        resultsEl.style.display = "block";
        return;
      }

      resultsEl.innerHTML = athletes.map(a => {
        const name   = a.displayName || "";
        const team   = a.subtitle    || "Unknown Team";
        // ESPN ID is the number after "a:" in the uid field e.g. "s:40~l:59~a:3904577"
        const espnId = (a.uid || "").split("~a:")[1] || "";
        return `
          <div class="search-result" onclick="selectPlayer(${JSON.stringify({name, team, espn_id: espnId}).replace(/"/g, '&quot;')})">
            <div class="result-name">${esc(name)}</div>
            <div class="result-team">${esc(team)}</div>
          </div>`;
      }).join("");
      resultsEl.style.display = "block";

    } catch(e) {
      hintEl.textContent = "Search failed — try again";
      resultsEl.style.display = "none";
    }
  }

  function selectPlayer(player) {
    _selectedPlayer = player;

    document.getElementById("search-results").style.display = "none";
    document.getElementById("search-group").style.display   = "none";

    document.getElementById("confirm-name").textContent = player.name;
    document.getElementById("confirm-team").textContent = player.team;
    document.getElementById("confirm-card").style.display  = "block";
  }

  function cancelSearch() {
    _selectedPlayer = null;
    document.getElementById("confirm-card").style.display  = "none";
    document.getElementById("search-group").style.display  = "block";
    document.getElementById("inp-search").value = "";
    document.getElementById("inp-ir").checked   = false;
  }

  async function confirmAdd() {
    if (!_selectedPlayer) return;

    const isIr = document.getElementById("inp-ir").checked;
    const { name, espn_id, team } = _selectedPlayer;

    const { error } = await sb.from("roster_config").insert({ name, espn_id, team, is_ir: isIr });

    if (error) {
      showToast(error.code === "23505" ? "Already on roster" : "Add failed", "error");
      return;
    }

    showToast(`${name} added`, "success");
    cancelSearch();
    loadRoster();
  }

  // ── Toast ─────────────────────────────────────────────

  let _toastTimer;
  function showToast(msg, type = "success") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className   = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ""; }, 2500);
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // Close dropdown if tapping outside
  document.addEventListener("click", e => {
    if (!e.target.closest("#search-group")) {
      document.getElementById("search-results").style.display = "none";
    }
  });

  loadRoster();
</script>
</body>
</html>
